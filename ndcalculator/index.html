<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

	<title>ND Calculator</title>

	<link type="text/css" rel="stylesheet" media="all" href="css/index.css" />

	<script type="text/javascript" src="js/jquery-3.2.1.min.js"></script>
	<script type="text/javascript" src="js/jquery.easing.1.3.js"></script>
	<script type="text/javascript" src="js/index.js"></script>
</head>

<body>
	<div id="Container">
		<div id="SsContainer">
			<h2>Normal Shutter Speed</h2>
			<p id="SsValue" class="Value"></p>
			<p id="SsProgressBar" class="ProgressBar"><span></span></p>
		</div>

		<div id="SsNdContainer">
			<h2>Shutter Speed with Filter</h2>
			<p id="SsNdValue" class="Value"></p>
			<p id="SsNdProgressBar" class="ProgressBar"><span></span></p>
		</div>

		<p id="ArrowIcon" class="GlyphIcon"><span class="GlyphIconCircleArrowDown"></span></p>

		<div id="NdContainer">
			<div>
				<h2>Total ND</h2>
				<p class="Value" id="NdValue"></p>
				<p class="SubValue" id="OdStopsValue"></p>
			</div>
			<div>
				<h2>ND 1</h2>
				<p class="Value" id="Nd1Value"></p>
				<p class="SubValue" id="OdStops1Value"></p>
			</div>
			<div>
				<h2>ND 2</h2>
				<p class="Value" id="Nd2Value"></p>
				<p class="SubValue" id="OdStops2Value"></p>
			</div>
			<div>
				<h2>ND 3</h2>
				<p class="Value" id="Nd3Value"></p>
				<p class="SubValue" id="OdStops3Value"></p>
			</div>
		</div>
	</div>
</body>
</html>
